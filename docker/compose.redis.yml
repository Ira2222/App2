version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: app2-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: src/App2.Api/Dockerfile
    # Or pull a published image:
    # image: ghcr.io/<OWNER>/<REPO>:v0.1.0
    container_name: app2-api
    depends_on:
      - redis
    ports:
      - "${PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      Features__OutputCaching: "true"
      Features__RedisOutputCache: "true"
      Redis__ConnectionString: "redis:6379,abortConnect=false"
      Redis__InstanceName: "app2:oc:"
    restart: unless-stopped
