version: "3.9"

# Usage:
#   # (A) Build locally from your Dockerfile (fast inner loop)
#   docker compose -f docker/compose.api.yml up --build -d
#
#   # (B) Pull from GHCR (set IMAGE + TAG in .env or override inline)
#   IMAGE=ghcr.io/<OWNER>/<REPO> TAG=v0.1.0 docker compose -f docker/compose.api.yml up -d
#
#   # Stop
#   docker compose -f docker/compose.api.yml down -v

services:
  api:
    # ---------- choose ONE of these 2 blocks ----------
    # 1) Build locally (preferred for dev)
    build:
      context: ..
      dockerfile: src/App2.Api/Dockerfile
    # 2) OR use a published image from GHCR (uncomment next line and remove `build:` above)
    # image: "${IMAGE:-ghcr.io/OWNER/REPO}:${TAG:-main}"
    # --------------------------------------------------

    container_name: app2-api
    ports:
      - "${PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
    # volumes:
    #   - ../src/App2.Api/appsettings.Development.json:/app/appsettings.Development.json:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    restart: unless-stopped
