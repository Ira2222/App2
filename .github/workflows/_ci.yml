name: reusable-ci

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '8.0.x'
      project-name:
        required: false
        type: string
        default: 'app2'
      api-project-path:
        required: false
        type: string
        default: 'src/App2.Api/App2.Api.csproj'

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm run build

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Generate SBOM
        run: |
          dotnet restore
          dotnet tool install --global Microsoft.Sbom.DotNetTool
          sbom-tool generate -b . -bc . -pn App2 -pv 1.0.0 -ps "Montgomery County FIN" -nsb https://github.com/${{ github.repository }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: _manifest/spdx_2.2/

  windows-export:
    needs:
      - build-test
      - web-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Publish API
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'api'
          dotnet publish ${{ inputs.api-project-path }} -c Release -o $publishDir

      - name: Zip API bundle
        shell: pwsh
        run: |
          $apiOutput = Join-Path $env:RUNNER_TEMP 'api'
          $zipPath = Join-Path $env:RUNNER_TEMP '${{ inputs.project-name }}-api-win.zip'
          Compress-Archive -Path (Join-Path $apiOutput '*') -DestinationPath $zipPath -Force

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web assets
        working-directory: apps/web
        run: npm run build

      - name: Zip web bundle
        shell: pwsh
        run: |
          $distPath = Join-Path $PWD 'apps/web/dist'
          $zipPath = Join-Path $env:RUNNER_TEMP '${{ inputs.project-name }}-web-win.zip'
          Compress-Archive -Path (Join-Path $distPath '*') -DestinationPath $zipPath -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project-name }}-windows-bundles
          path: |
            ${{ runner.temp }}\${{ inputs.project-name }}-api-win.zip
            ${{ runner.temp }}\${{ inputs.project-name }}-web-win.zip
