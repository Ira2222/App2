name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Run weekly on Saturdays at 1:30 UTC
    - cron: '30 1 * * 6'
  push:
    branches: [ main ]
  workflow_dispatch:

# Declare default permissions as read only
permissions: read-all

jobs:
  # Main branch: publish results to OpenSSF
  scorecard-publish:
    name: Scorecard (publish)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # REQUIRED for Scorecard v2 publish_results
      contents: read
      actions: read
      security-events: write
      id-token: write

    steps:
      # IMPORTANT: Scorecard v2 with publish_results: true
      # can ONLY use these 4 actions (no harden-runner!):
      # - actions/checkout
      # - actions/upload-artifact
      # - github/codeql-action/upload-sarif
      # - ossf/scorecard-action

      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@f779452ac5af1c261dce0346a8b332469033a4cf # v3.27.6
        with:
          sarif_file: results.sarif

  # PRs: analyze without publishing
  scorecard-pr:
    name: Scorecard (PR analysis)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@f779452ac5af1c261dce0346a8b332469033a4cf # v3.27.6
        with:
          sarif_file: results.sarif
