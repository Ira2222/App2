name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          Features__KeyVault: "false"
          Features__RedisOutputCache: "false"
          Features__Authentication: "false"
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-tests
          path: |
            **/TestResults/*.trx
            **/TestResults/**/*.xml
            **/coverage.cobertura.xml

  frontend:
    name: Web build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Web Dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  package-audit:
    name: Package audit (dotnet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: dotnet package list --outdated
        run: dotnet package list --outdated --include-transitive --highest-patch

  sbom:
    name: Generate SBOM (repo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom-repo.cdx.json
      - name: Upload SBOM
        id: upload_sbom
        uses: actions/upload-artifact@v4
        with:
          name: sbom-repo
          path: sbom-repo.cdx.json
      - name: Attest SBOM (provenance)
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: sbom-repo.cdx.json
          subject-digest: sha256:${{ steps.upload_sbom.outputs.artifact-digest }}
          show-summary: true
