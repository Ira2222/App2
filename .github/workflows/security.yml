name: security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 3 * * 1'

# Workflow default: least privilege
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write  # REQUIRED for SARIF upload
      actions: read          # Allows queries to check workflow config
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Initialize CodeQL (C# + JS/TS + Actions)
        uses: github/codeql-action/init@v3
        with:
          languages: csharp,javascript-typescript,actions
          queries: security-extended

      - name: Build .NET projects
        run: dotnet build -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  trivy-fs:
    name: Trivy (repo scan → SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # REQUIRED for SARIF upload
    steps:
      - uses: actions/checkout@v4
      - name: Trivy repo scan (fs)
        uses: aquasecurity/trivy-action@0.33.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  trivy-image:
    name: Trivy (container image → SARIF)
    # Only run on main branch to avoid failures when image doesn't exist yet
    if: github.ref == 'refs/heads/main' && hashFiles('**/Dockerfile') != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # REQUIRED for SARIF upload
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (if Dockerfile present)
        run: |
          docker build -t app2-api:ci -f src/App2.Api/Dockerfile .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.0
        with:
          scan-type: 'image'
          image-ref: 'app2-api:ci'
          format: 'sarif'
          output: 'trivy-image.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
